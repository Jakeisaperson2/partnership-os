[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Set a master password to protect the database manager page.
; Generate one with: python3 -c "import secrets; print(secrets.token_hex(24))"
; admin_passwd = CHANGE_ME

; Logging
log_level = info

; Workers — set to 0 for single-process (dev mode). Increase for production.
workers = 0

; Dev mode — enables the Assets debug menu in the UI.
; Uncomment the line below to activate it.
; dev_mode = assets
